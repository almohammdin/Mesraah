<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسراح | اختبار Native Live</title>
<style>
html,body{margin:0;height:100%;background:#0d3656;font-family:Arial,sans-serif}body{display:grid;grid-template-rows:42px 1fr}.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;color:#fff;background:#0d3656;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px}.testbar strong{font-size:13px}.status{opacity:.78}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="testbar"><strong>اختبار مسراح Native Live v0.10.0</strong><span class="status" id="testStatus">أجهز النسخة التجريبية…</span></div>
<iframe id="appFrame" src="./?native-test=100"></iframe>
<script>
(() => {
  const frame = document.getElementById('appFrame');
  const status = document.getElementById('testStatus');
  const CDN = 'https://cdn.jsdelivr.net/gh/almohammdin/Mesraah@8332ac4da7766ffb1cba67b8764eebfeeee6254e/';

  function addScript(doc, src, type = '') {
    return new Promise((resolve, reject) => {
      const s = doc.createElement('script');
      if (type) s.type = type;
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('load-failed: ' + src));
      doc.head.appendChild(s);
    });
  }

  async function waitForFlag(win, check, label) {
    for (let i = 0; i < 180; i += 1) {
      if (win.__MESRAAH_NATIVE_LIVE_LOAD_ERROR__) throw new Error(win.__MESRAAH_NATIVE_LIVE_LOAD_ERROR__);
      if (check()) return;
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    throw new Error(label + '-timeout');
  }

  frame.addEventListener('load', async () => {
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      status.textContent = 'أجهز App Check والصوت المستمر…';
      await new Promise(resolve => setTimeout(resolve, 1800));

      await addScript(doc, CDN + 'native-live-appcheck-v093.js', 'module');
      await waitForFlag(win, () => win.__MESRAAH_NATIVE_APPCHECK_READY__ === true && typeof win.MesraahGetAppCheckToken === 'function', 'app-check');

      status.textContent = 'أثبت الصوت وأربط تفاصيل المهام…';
      await addScript(doc, CDN + 'native-live-config.js');
      await addScript(doc, CDN + 'native-live-sdk-v100.js', 'module');
      await waitForFlag(win, () => win.__MESRAAH_NATIVE_LIVE_VERSION__ === '0.10.0' && win.MesraahNativeLive, 'native-live-tools');

      const button = doc.getElementById('v80VoiceChat');
      if (button) {
        const strong = button.querySelector('strong');
        const small = button.querySelector('small');
        if (strong) strong.textContent = 'محادثة صوتية حية';
        if (small) small.textContent = 'Native Live v0.10.0 · صوت ثابت وتفاصيل كاملة';
      }
      status.textContent = 'جاهز — الصوت ثابت ومسراح يحفظ الوقت والأشخاص والمكان';
      win.__MESRAAH_NATIVE_TEST__ = true;
    } catch (error) {
      console.error(error);
      status.textContent = 'تعذر تجهيز الاختبار — ' + String(error?.message || error);
    }
  }, { once: true });
})();
</script>
</body>
</html>
