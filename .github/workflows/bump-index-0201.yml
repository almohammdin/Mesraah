name: Bump Mesraah entry to 0.20.1
on:
  push:
    branches: [fix/voice-syntax-0201]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-syntax-0201
          fetch-depth: 0
      - name: Bump entry script cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('ui-v072.js?v=0.20.0','ui-v072.js?v=0.20.1')
          p.write_text(s)
          PY
          if git diff --quiet -- index.html; then
            echo 'Index already bumped'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump Mesraah entry cache to 0.20.1'
          git push origin HEAD:fix/voice-syntax-0201
