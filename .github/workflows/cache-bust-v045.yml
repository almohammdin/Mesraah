name: Cache bust Mesraah identity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-v045.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump identity cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('brand-header-v043.css?v=0.4.4','brand-header-v043.css?v=0.4.5')
          s=s.replace('brand-header-v043.js?v=0.4.4','brand-header-v043.js?v=0.4.5')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Mesraah Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Bump Mesraah identity cache version"
          git push
