<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسراح | اختبار Native Live</title>
<style>
html,body{margin:0;height:100%;background:#0d3656;font-family:Arial,sans-serif}body{display:grid;grid-template-rows:42px 1fr}.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;color:#fff;background:#0d3656;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px}.testbar strong{font-size:13px}.status{opacity:.78}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="testbar"><strong>اختبار مسراح Native Live v0.9.2</strong><span class="status" id="testStatus">أجهز النسخة التجريبية…</span></div>
<iframe id="appFrame" src="./?native-test=092"></iframe>
<script>
(() => {
  const frame = document.getElementById('appFrame');
  const status = document.getElementById('testStatus');
  const CDN = 'https://cdn.jsdelivr.net/gh/almohammdin/Mesraah@065871b80d6797b2c2fc181a1ab118dccf99b6ec/';

  function addScript(doc, src, type = '') {
    return new Promise((resolve, reject) => {
      const s = doc.createElement('script');
      if (type) s.type = type;
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('load-failed: ' + src));
      doc.head.appendChild(s);
    });
  }

  async function waitForNative(win) {
    for (let i = 0; i < 80; i += 1) {
      if (win.__MESRAAH_NATIVE_LIVE_LOAD_ERROR__) throw new Error(win.__MESRAAH_NATIVE_LIVE_LOAD_ERROR__);
      if (win.__MESRAAH_NATIVE_LIVE_VERSION__ === '0.9.2' && win.MesraahNativeLive) return;
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    throw new Error('native-live-v092-timeout');
  }

  frame.addEventListener('load', async () => {
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      status.textContent = 'أحمّل Native Live v0.9.2…';
      await new Promise(resolve => setTimeout(resolve, 1800));
      await addScript(doc, CDN + 'firebase-appcheck-core.js', 'module');
      await addScript(doc, CDN + 'native-live-config.js');
      await addScript(doc, CDN + 'native-live-v092.js');
      await waitForNative(win);

      const button = doc.getElementById('v80VoiceChat');
      if (button) {
        const strong = button.querySelector('strong');
        const small = button.querySelector('small');
        if (strong) strong.textContent = 'محادثة صوتية حية';
        if (small) small.textContent = 'Gemini Native Live v0.9.2 — اختبار';
      }
      status.textContent = 'جاهز — اضغط «محادثة صوتية حية» داخل مسراح';
      win.__MESRAAH_NATIVE_TEST__ = true;
    } catch (error) {
      console.error(error);
      status.textContent = 'تعذر تجهيز الاختبار — ' + String(error?.message || error);
    }
  }, { once: true });
})();
</script>
</body>
</html>
